name: Nightly salt check

on:
  schedule:
    # 23:00 UTC = 5 pm Chicago in winter (6 pm during daylight saving)
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test notification regardless of forecast"
        type: boolean
        default: false

# Needed so the keepalive step below can push a commit
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check forecast and notify
        run: python check_salt.py ${{ inputs.test && '--test' || '' }}

      # GitHub turns off scheduled workflows after 60 days with no commits.
      # This writes the run date to a small file and commits it, which counts
      # as activity and keeps the schedule alive indefinitely.
      - name: Keep repo active
        if: always()
        run: |
          date -u +"%Y-%m-%d %H:%M UTC" > .last-run
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last-run
          git commit -m "chore: keepalive $(date -u +%F)" || exit 0
          git push
